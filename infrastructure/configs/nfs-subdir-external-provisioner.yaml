---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-retain
provisioner: nfs-storage
reclaimPolicy: Retain
parameters:
  pathPattern: "retain/${.PVC.namespace}/${.PVC.name}"
  onDelete: retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-archive
provisioner: nfs-storage
reclaimPolicy: Retain
parameters:
  pathPattern: "archive/${.PVC.namespace}/${.PVC.name}"
  onDelete: retain
