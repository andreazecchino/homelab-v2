apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: local-ca
      hosts:
        - host: forgejo.home.arpa
          paths:
            - path: /
              pathType: Prefix
              port: https
      tls:
        - secretName: local-ca-secret
          hosts:
            - forgejo.home.arpa
