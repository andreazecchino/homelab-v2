apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy
          namespace: envoy-gateway-system
          sectionName: https
      hostnames:
        - "forgejo.home.arpa"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: forgejo-http
              port: 3000
