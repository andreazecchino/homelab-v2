apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
    ingress:
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: local-ca
      hosts:
        - paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: forgejo-http
                  port:
                    number: 3000
      tls:
        - secretName: local-ca-secret
