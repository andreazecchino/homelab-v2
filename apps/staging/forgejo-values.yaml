apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  values:
    ingress:
      enabled: true
      hosts:
        - host: forgejo.home.arpa
      tls:
        - hosts:
            - forgejo.home.arpa
    httpRoute:
      enabled: false
      hostnames:
        - forgejo.home.arpa
